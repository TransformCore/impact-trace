name: Bug report
description: Report a problem with ImpactTrace
labels: [bug]
body:
  - type: textarea
    id: command
    attributes:
      label: Command run
      description: The exact `impact-trace` command you ran
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ImpactTrace version
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
